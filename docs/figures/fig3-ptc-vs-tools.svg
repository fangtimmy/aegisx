  <rect x="530" y="40" width="570" height="480" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="815" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">PTC · 多步动作压缩为单次执行</text>
